name: CI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y zsh
      - name: Secure runner completion directories
        if: runner.os == 'Linux'
        run: |
          directories=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
          while IFS= read -r directory; do
            if [ -n "$directory" ]; then sudo chmod go-w "$directory"; fi
          done <<< "$directories"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:terminal
